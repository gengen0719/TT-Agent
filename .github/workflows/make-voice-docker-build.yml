name: make-voice Docker build

on:
  pull_request:
    paths:
      - "make-voice/Dockerfile"
      - ".github/workflows/make-voice-docker-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: make-voice
          file: make-voice/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: make-voice:ci
          build-args: |
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test import
        run: docker run --rm --entrypoint python make-voice:ci -c "import voicevox_core, awslambdaric, boto3; print('ok')"
